services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://clouduser:cloudpass@db:5432/clouddb
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16.8-bookworm
    environment:
      POSTGRES_USER: clouduser
      POSTGRES_PASSWORD: cloudpass
      POSTGRES_DB: clouddb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clouduser -d clouddb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: