name: Build and deploy API

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::917993967907:role/cloud-lab1-github-actions
          aws-region: eu-north-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: 917993967907.dkr.ecr.eu-north-1.amazonaws.com/cloud-lab1-api:bootstrap

      - name: Restart ECS service
        run: aws ecs update-service --cluster cloud-lab1-cluster --service cloud-lab1-api --force-new-deployment
