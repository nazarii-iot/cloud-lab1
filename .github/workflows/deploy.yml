name: Build and deploy API

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: cloud-lab1-api
  ECS_CLUSTER: cloud-lab1-cluster
  ECS_SERVICE: cloud-lab1-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::917993967907:role/cloud-lab1-github-actions
          aws-region: eu-north-1

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: 917993967907.dkr.ecr.eu-north-1.amazonaws.com/cloud-lab1-api:${{ github.sha }}-${{ github.run_attempt }}

      - name: Register new ECS task definition
        env:
          IMAGE_URI: 917993967907.dkr.ecr.eu-north-1.amazonaws.com/cloud-lab1-api:${{ github.sha }}-${{ github.run_attempt }}
        run: |
          TASK_DEFINITION=$(aws ecs describe-task-definition --task-definition cloud-lab1-api --query taskDefinition --output json)
          NEW_TASK=$(echo "$TASK_DEFINITION" | jq --arg IMAGE "$IMAGE_URI" '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')
          echo "$NEW_TASK" > task-definition.json
          aws ecs register-task-definition --cli-input-json file://task-definition.json

      - name: Deploy to ECS
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition cloud-lab1-api --force-new-deployment
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

